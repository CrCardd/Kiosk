info:
  name: Create
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/variant"
  headers:
    - name: Authorization
      value: Bearer {{o_token}}
  body:
    type: json
    data: |-
      {
          "Name" : "COMBO",
          "Price" : 10.0,
          "Image" : "https://image.com",
          "Ingredients" : null,
          "Surpass" : null,
          "Available" : null,
          "ServiceId" : "00000000-0000-0000-0000-000000000002",
          "Parts" : [
              "00000000-0000-0000-0000-000000000001",
              "00000000-0000-0000-0000-000000000004"
          ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

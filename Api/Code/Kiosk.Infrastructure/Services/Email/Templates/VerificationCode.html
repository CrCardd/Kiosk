<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk</title>
</head>

<body style="
    margin:0;
    padding:32px 16px;
    background:#111111;
    font-family:Arial,Helvetica,sans-serif;
">

    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">

                <table width="520" cellpadding="0" cellspacing="0" style="
                    background:#1E1E1E;
                    border:1px solid #5A3E2B;
                    border-radius:18px;
                ">

                    <tr>
                        <td align="center" style="padding:36px;">

                            <p style="
                                margin:0;
                                color:#E6DED3;
                                font-size:15px;
                                line-height:1.7;
                            ">
                                Use the verification code below to complete your registration.
                            </p>

                            <div style="
                                display:inline-block;
                                margin:28px 0 22px;
                                padding:16px 28px;
                                background:#2B211B;
                                border:2px solid #E88C1A;
                                border-radius:14px;
                                color:#F6C445;
                                font-size:34px;
                                font-weight:bold;
                                letter-spacing:8px;
                                user-select:all;
                            ">
                                {{Code}}
                            </div>

                            <p style="
                                margin:0;
                                color:#D8D0C5;
                                font-size:14px;
                                line-height:1.6;
                            ">
                                This code will expire in
                                <strong style="color:#F6C445;">
                                    {{Minutes}} minutes
                                </strong>.
                            </p>

                            <p style="
                                margin:20px 0 0;
                                color:#AFA79C;
                                font-size:13px;
                                line-height:1.7;
                            ">
                                If you didn't request this verification,
                                you can safely ignore this email.
                            </p>

                            <hr style="
                                margin:28px 0 18px;
                                border:none;
                                border-top:1px solid #3A312A;
                            ">

                            <p style="
                                margin:0;
                                color:#7E766C;
                                font-size:12px;
                            ">
                                © {{Year}} Eleven Cheese
                            </p>

                            <p style="
                                margin:6px 0 0;
                                color:#666666;
                                font-size:11px;
                            ">
                                This is an automated email. Please do not reply.
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
